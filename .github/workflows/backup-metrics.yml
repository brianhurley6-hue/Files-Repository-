name: Backup Clone Metrics
on:
schedule:
- cron: '0 0 * * *'
workflow_dispatch:
permissions:
contents: write
jobs:
backup:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- run: |
mkdir -p metrics-backup
DATE=$(date +%Y-%m-%d)
curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/traffic/clones > metrics-backup/clones-$DATE.json
- uses: stefanzweifel/git-auto-commit-action@v5
with:
commit_message: "Daily metrics backup"
branch: main
